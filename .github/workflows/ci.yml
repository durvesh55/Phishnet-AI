name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw   # throw-away CI database only
          MYSQL_DATABASE: phishnet_test
          MYSQL_USER: phishnet
          MYSQL_PASSWORD: ci_app_pw
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_pw"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: phishnet
      MYSQL_PASSWORD: ci_app_pw
      MYSQL_DATABASE: phishnet_test
      TEST_MYSQL_DATABASE: phishnet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q app ml scripts run.py
      - name: Lint
        run: ruff check app ml tests scripts run.py
      - name: Validate project configuration
        run: |
          python - <<'EOF'
          import json, yaml
          yaml.safe_load(open("docker-compose.yml"))
          from app.api.openapi import SPEC
          assert SPEC["paths"]
          print("config ok")
          EOF
      - name: Train model (CI copy)
        run: python -m ml.training.train
      - name: Tests
        run: pytest -q
